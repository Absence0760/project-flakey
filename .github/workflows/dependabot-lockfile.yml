name: Dependabot lockfile sync

# Dependabot updates <workspace>/package.json but never touches the root
# pnpm-lock.yaml, which breaks tests.yml's `pnpm install --frozen-lockfile`. This
# workflow regenerates the lockfile on every Dependabot PR and commits the
# result back, which retriggers CI and lets the PR go green without manual
# intervention.
#
# Setup (one-time):
#   1. Create a fine-grained PAT scoped to this repo with "Contents: Write"
#      permission (Settings → Developer settings → Personal access tokens →
#      Fine-grained tokens). Expiry up to you — rotate when it expires.
#   2. Add it as a **Dependabot** secret named `DEPENDABOT_LOCKFILE_PAT`:
#      Settings → Secrets and variables → **Dependabot** → New repository
#      secret. NOT the Actions tab.
#      CLI: `gh secret set DEPENDABOT_LOCKFILE_PAT --app dependabot`
#
# Why the Dependabot store (gotcha that has bitten twice): GitHub
# treats Dependabot-authored PRs as forks for permission purposes.
# Workflows triggered by them get a read-only GITHUB_TOKEN and CANNOT
# read secrets from the regular Actions store — only from the separate
# Dependabot secrets store. A PAT stashed under Settings → Actions
# secrets is invisible to this workflow when Dependabot opens a PR.
# `gh api repos/:owner/:repo/dependabot/secrets` lists the right store;
# an empty list means this workflow is inert no matter how green it looks.
#
# The second time it bit, nothing said so: the gate step below simply set
# skip=true and the job went green, so an entirely disabled sync was
# indistinguishable from a working one. PR #118 sat red on
# ERR_PNPM_OUTDATED_LOCKFILE from 2026-07-27 to 2026-08-20 with a green
# lockfile-sync run against it the whole time. The gate now fails the job
# when a sync is needed and the PAT is missing, and only warns when there
# was nothing to sync anyway.
#
# Why a PAT and not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not retrigger
# workflows — GitHub blocks that path to prevent infinite loops. A PAT push is
# attributed to the token owner and does retrigger `pull_request` events, so
# tests.yml re-runs on the synced branch.
#
# ---- Two-job split (closes CodeQL actions/untrusted-checkout) ----
#
# The CodeQL rule `actions/untrusted-checkout/medium` fires on any workflow
# that (a) has access to secrets AND (b) checks out PR-head code. Even with
# `persist-credentials: false` + `--ignore-scripts` mitigations, the heuristic
# doesn't see those guards. The official safe pattern — and the one CodeQL
# accepts — is to split the work into two jobs:
#
#   - regenerate: NO secrets. Runs `pnpm install --lockfile-only` against the
#     PR-head code. The worst a malicious bump could do here is produce a
#     bogus pnpm-lock.yaml — which would then fail tests.yml's frozen-lockfile
#     check on the next run, so a human notices.
#
#   - push: NO PR-head code in the working tree. Has the PAT. Downloads the
#     lockfile from job 1's artifact, validates the PR-head ref against the
#     event payload, and commits + pushes via the PAT. Never runs any code
#     from the PR-head checkout.
#
# This pattern is the one referenced in the GitHub Security Lab "Keeping
# your GitHub Actions and workflows secure" series.

on:
  pull_request:
    paths:
      - "**/package.json"

permissions:
  contents: read

jobs:
  regenerate:
    # Only run on Dependabot-authored PRs. github.actor is the bot username.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      # Whether a sync is actually needed. The push job uses this to tell
      # "nothing to do" apart from "could not do it" — see its gate step.
      changed: ${{ steps.diff.outputs.changed }}
    # No `permissions:` override — this job inherits the workflow-level
    # `contents: read` AND has no access to any secret. Even if pnpm
    # install somehow executed attacker code, there's nothing here to
    # exfiltrate.
    steps:
      # codeql[actions/untrusted-checkout/medium]
      #
      # NOTE: that marker does NOT suppress anything on its own — CodeQL has
      # no comment-suppression for the Actions extractor, so this alert (and
      # the equivalent one on the push job's fetch) has to be dismissed
      # through the code-scanning API or UI. The marker is here to mark the
      # reviewed spot, not to silence the scanner.
      #
      # Checking out the PR head is the whole point of this job, and it is
      # safe here for reasons CodeQL's heuristic cannot see: the job runs on
      # `pull_request` (not `pull_request_target`), inherits the workflow's
      # `contents: read`, is passed no secret at all, discards the token with
      # `persist-credentials: false`, and the only thing it runs against the
      # tree is `pnpm install --lockfile-only --ignore-scripts` — which
      # executes no lifecycle scripts. The credential-bearing half of this
      # workflow is the separate `push` job below, and that one never writes
      # the PR-head tree to disk.
      - name: Checkout PR branch (no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # Belt-and-braces: even though no secrets are exposed to this
          # job, don't leave the GITHUB_TOKEN sitting in .git/config.
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate root lockfile
        # --lockfile-only updates pnpm-lock.yaml without populating
        # node_modules. pnpm does not run any lifecycle scripts in this
        # mode; --ignore-scripts is redundant but explicit.
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Regenerate frontend lockfile
        # frontend/ is NOT a workspace member (pnpm-workspace.yaml only
        # globs packages/*), so it carries its own lockfile and the root
        # install above ignores it. Without this step, a Dependabot bump
        # to frontend/package.json leaves frontend/pnpm-lock.yaml stale,
        # which fails tests.yml's `pnpm install --frozen-lockfile
        # --ignore-workspace` step. That's what bit commit 12fd2e4 and
        # required a manual lockfile regen on top of the bot PR.
        working-directory: frontend
        run: pnpm install --lockfile-only --ignore-scripts --ignore-workspace

      - name: Bail if no lockfiles changed
        id: diff
        run: |
          if git diff --quiet pnpm-lock.yaml frontend/pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload lockfile artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Single artifact bundles both lockfiles; upload-artifact
          # preserves the relative paths so the push job can `cp` each
          # one back into place.
          name: pnpm-locks
          path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
          retention-days: 1

  push:
    needs: regenerate
    # Only fire when the regenerate job actually produced an artifact.
    # The `needs.regenerate.result == 'success'` guard makes the chain
    # explicit; the artifact-download step below would also fail if
    # the artifact didn't exist.
    if: github.actor == 'dependabot[bot]' && needs.regenerate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # This job touches the PAT and pushes — it needs contents: read
      # only because the actual push is via the PAT (which has its own
      # scope), not GITHUB_TOKEN. The token here is just for the
      # artifact download API.
      contents: read
    steps:
      # A missing PAT used to set skip=true and let this job go green. That
      # made "the sync is disabled" indistinguishable from "the sync ran",
      # and it hid a completely inert workflow for weeks: #118 sat red on
      # ERR_PNPM_OUTDATED_LOCKFILE from 2026-07-27 while every run of this
      # workflow reported success. The gate now separates the two cases —
      # nothing to do is fine, unable to do it is not.
      - name: Gate on the PAT
        id: gate
        env:
          PAT: ${{ secrets.DEPENDABOT_LOCKFILE_PAT }}
          CHANGED: ${{ needs.regenerate.outputs.changed }}
        run: |
          if [ -n "$PAT" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No PAT. Whether that is a problem depends entirely on whether
          # this PR actually needs its lockfiles synced.
          if [ "$CHANGED" = "true" ]; then
            echo "::error title=Lockfile sync is disabled::This PR needs a lockfile sync but DEPENDABOT_LOCKFILE_PAT is not configured, so it cannot be pushed. The PR will fail its frozen-lockfile install until someone regenerates the lockfiles by hand. Fix: create a fine-grained PAT scoped to this repo with Contents: Write, then 'gh secret set DEPENDABOT_LOCKFILE_PAT --app dependabot'. It must live in the Dependabot secrets store, NOT the Actions store — Dependabot-authored PRs cannot read Actions secrets."
            exit 1
          fi

          echo "::warning title=Lockfile sync is disabled::DEPENDABOT_LOCKFILE_PAT is not configured. This PR happens not to need a lockfile sync, so nothing is broken right now, but the automation is inert and the next bump that does need one will fail."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      # Gated on the regenerate job's own verdict rather than on whether the
      # download happened to work. This step used to carry
      # `continue-on-error: true` with the next step keyed off
      # `steps.download.outcome == 'success'`, which was the same silent-skip
      # defect as the PAT gate above: an artifact that genuinely failed to
      # download — expired, throttled, API error — skipped the push and left
      # the job green. `changed == 'true'` means the artifact was uploaded, so
      # a failure here is a real failure and should stop the job.
      - name: Download lockfile artifact
        if: steps.gate.outputs.skip == 'false' && needs.regenerate.outputs.changed == 'true'
        # The artifact preserves relative paths, so this drops pnpm-lock.yaml
        # at CWD root and frontend/pnpm-lock.yaml under a frontend/ subdir.
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pnpm-locks

      - name: Validate + push lockfile
        if: steps.gate.outputs.skip == 'false' && needs.regenerate.outputs.changed == 'true'
        env:
          DEPENDABOT_LOCKFILE_PAT: ${{ secrets.DEPENDABOT_LOCKFILE_PAT }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Defensive sanity check: a malicious PR-head couldn't have
          # provided a fake ref here because PR_HEAD_REF comes from
          # the trusted event payload, not the PR-head workspace.
          # github.event.pull_request.head.ref is read from the API,
          # not from any file the PR could write.
          if [ -z "$PR_HEAD_REF" ]; then
            echo "::error::Missing PR head ref in event payload." >&2
            exit 1
          fi

          # The PR-head tree is NEVER written to the working directory in
          # this job. It holds the PAT, so materialising attacker-controlled
          # files beside the credential in .git/config is a window worth not
          # having — even though nothing here executes them. The commit is
          # assembled with plumbing instead: read the fetched tree into the
          # index, swap the two lockfile blobs, write it back.
          mkdir push-workspace && cd push-workspace
          git init -q
          git remote add origin "https://x-access-token:${DEPENDABOT_LOCKFILE_PAT}@github.com/${REPO}.git"
          git fetch origin "$PR_HEAD_REF" --depth 1

          # Refuse to push if the head moved while we were regenerating —
          # otherwise this force-lands a lockfile derived from a manifest
          # that is no longer what the branch says.
          fetched=$(git rev-parse FETCH_HEAD)
          if [ "$fetched" != "$PR_HEAD_SHA" ]; then
            echo "::error::PR head moved during the run ($fetched != $PR_HEAD_SHA) — refusing to push a stale lockfile." >&2
            exit 1
          fi

          # Both lockfiles: the root one (packages/* workspace) and
          # frontend/pnpm-lock.yaml, which is a standalone pnpm project
          # outside that workspace and so has its own lockfile. The
          # artifact preserved relative paths, so the regenerated files sit
          # at ../pnpm-lock.yaml and ../frontend/pnpm-lock.yaml.
          git read-tree "$PR_HEAD_SHA"
          changed=false
          for lock in pnpm-lock.yaml frontend/pnpm-lock.yaml; do
            existing=$(git rev-parse "${PR_HEAD_SHA}:${lock}" 2>/dev/null || echo none)
            blob=$(git hash-object -w "../${lock}")
            if [ "$existing" != "$blob" ]; then
              git update-index --add --cacheinfo "100644,${blob},${lock}"
              changed=true
            fi
          done

          if [ "$changed" = false ]; then
            echo "Lockfiles already in sync after fetch — nothing to commit."
            exit 0
          fi

          tree=$(git write-tree)
          commit=$(
            GIT_AUTHOR_NAME="dependabot[bot]" \
            GIT_AUTHOR_EMAIL="49699333+dependabot[bot]@users.noreply.github.com" \
            GIT_COMMITTER_NAME="dependabot[bot]" \
            GIT_COMMITTER_EMAIL="49699333+dependabot[bot]@users.noreply.github.com" \
            git commit-tree "$tree" -p "$PR_HEAD_SHA" -m "chore: sync pnpm lockfiles"
          )
          git push origin "${commit}:refs/heads/${PR_HEAD_REF}"
